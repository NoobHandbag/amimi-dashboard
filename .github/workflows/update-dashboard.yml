name: update-dashboard

# Produce ops-feed-8f21.json via scripts/build-feed.mjs.
# Sorgente selezionata dalla repo variable DATA_SOURCE:
#   (assente|'sheet')  -> passthrough del backend Apps Script dashdata (comportamento storico)
#   'supabase'         -> ricostruisce lo stesso shape dalle viste Supabase (post-cutover)
# La pagina legge SOLO il file committato via raw.githubusercontent, senza mai
# toccare Google dal browser -> niente Drive lock sul telefono.

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feed (DATA_SOURCE = sheet oggi, supabase al cutover)
        env:
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'sheet' }}
        run: |
          node scripts/build-feed.mjs
          node -e "const d=require('./ops-feed-8f21.json'); if(!d.DATA||!Array.isArray(d.DATA.ceAmimiMonthly)){console.error('payload invalido');process.exit(1);} console.log('ok: mesi='+d.DATA.ceAmimiMonthly.length+' prodotti='+d.DATA.products.length);"

      - name: Commit se cambiato
        run: |
          git config user.name "amimi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops-feed-8f21.json
          git diff --staged --quiet || git commit -m "update dashboard data"
          git push
